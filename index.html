<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Alien Food War Prototype</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>  
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/WebGL.json", {onProgress: UnityProgress});
    </script>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer" style="width: 960px; height: 600px"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
        <div class="title">Alien Food War Prototype</div>
      </div>
      <div>
        <p>A survival game prototype made by</p>
        <strong>Maurílio da Motta Meireles</strong>
      </div>
      <br>
      <div>
        <ul>
          Instructions
          <li>
            Move: AWSD keys
          </li>
          <li>
            Jump: Spacebar
          </li>
          <li>
            Shoot: Left mouse button
          </li>
          <li>
            Switch weapon: Mouse ScrollWheel
          </li>
        </ul>
      </div>
      <br><strong>*The sounds used in this project are not of my property*</strong>
    </div>
  </body>
</html>
